<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacing Control</title>
    <meta name="description" content="Interactive control of font family, size, letter spacing, word spacing, line height, and font kerning.">
    <style>
        /* Center page content vertically and stack sections */
    
        #wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 2rem;
        }

        /* Control panel layout */
        #controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: min(400px, 90vw);
        }

        /* Keep control labels readable regardless of page font */
        #controls label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
        }

        /* Default page typeface (can be changed via Font dropdown) */
        body {
            font-family: "Times New Roman", Times, serif;
        }

        h1 {
            text-align: left;
            margin-bottom: 0;
            line-height: 1;
            padding-bottom: 0;
        }

        /* Sample paragraph — typography values updated by the sliders */
        p {
            max-width: 80vw;
            font-size: 16px;
            line-height: 1.5;
            letter-spacing: 0;
            word-spacing: 0;
            font-kerning: auto;
        }

        #fontFamily {
            height: 2rem;
            padding: .4rem;
        }

        /* Textarea for editing the sample paragraph content */
        #textContent {
            min-height: 5rem;
            resize: vertical;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
        }

        /* Radio options laid out in a row within the control group */
        .radio-group {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 0.75rem;
            border: none;
            margin: 0;
            padding: 0;
        }

        .radio-group legend {
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
            padding: 0;
            margin-bottom: 0.25rem;
        }

        .radio-group label {
            flex-direction: row;
            align-items: center;
            gap: 0.35rem;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <h1>Spacing control</h1>

        <!-- Sample text updated live by the Textarea and typography controls -->
        <p id="text">Because many students are choosing or feel pressure to shift to learning and problem-solving with AI, in less than three years these technologies have driven major shifts in campus culture.</p>

        <div id="controls">
            <!-- Edits the paragraph content; value is saved in localStorage -->
            <label>
                Text:
                <textarea id="textContent"></textarea>
            </label>

            <!-- Changes the font-family for the whole page -->
            <label>
                Font:
                <select id="fontFamily">
                    <option value='"Times New Roman", Times, serif'>Times New Roman</option>
                    <option value='Georgia, Courier'>Georgia</option>
                    <option value="Arial, Helvetica, sans-serif">Arial</option>
                    <option value="Verdana, Courier">Verdana</option>
                </select>
            </label>

            <!-- Font size in pixels -->
            <label>
                Font-Size: <span id="fontSizeValue">16px</span>
                <input type="range" id="fontSize" min="10" max="144" step="1" value="16">
            </label>

            <!-- Vertical space between lines (unitless multiplier) -->
            <label>
                Line-Height (Leading): <span id="lineHeightValue">1.2</span>
                <input type="range" id="lineHeight" min=".75" max="3" step="0.025" value="1.2">
            </label>

            <!-- Horizontal space between characters (in em) -->
            <label>
                Letter-Spacing (Tracking): <span id="letterSpacingValue">0em</span>
                <input type="range" id="letterSpacing" min="-0.1" max="0.25" step="0.001" value="0">
            </label>

            <!-- Extra space between words (in em; added to the normal word gap) -->
            <label>
                Word-Spacing: <span id="wordSpacingValue">0em</span>
                <input type="range" id="wordSpacing" min="-0.2" max="1" step="0.01" value="0">
            </label>
            <!-- Sets font-kerning on the sample paragraph: none, normal, or auto -->
            <fieldset class="radio-group">
                <legend>Font-Kerning:</legend>
                <label>
                    <input type="radio" name="fontKerning" value="none">
                    none
                </label>
                <label>
                    <input type="radio" name="fontKerning" value="normal">
                    normal
                </label>
                <label>
                    <input type="radio" name="fontKerning" value="auto" checked>
                    auto
                </label>
            </fieldset>
        </div>
    </div>

    <script>
        // DOM references for the sample text and controls
        const text = document.getElementById('text');
        const textContent = document.getElementById('textContent');
        const fontFamily = document.getElementById('fontFamily');
        const fontSize = document.getElementById('fontSize');
        const lineHeight = document.getElementById('lineHeight');
        const letterSpacing = document.getElementById('letterSpacing');
        const wordSpacing = document.getElementById('wordSpacing');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const lineHeightValue = document.getElementById('lineHeightValue');
        const letterSpacingValue = document.getElementById('letterSpacingValue');
        const wordSpacingValue = document.getElementById('wordSpacingValue');

        // Restore saved paragraph text, or fall back to the HTML default
        const STORAGE_KEY = 'spacingTextContent';
        const defaultText = text.textContent;
        const savedText = localStorage.getItem(STORAGE_KEY);
        textContent.value = savedText !== null ? savedText : defaultText;
        text.textContent = textContent.value;

        // Keep the paragraph and localStorage in sync as the user types
        textContent.addEventListener('input', () => {
            text.textContent = textContent.value;
            localStorage.setItem(STORAGE_KEY, textContent.value);
        });

        // Apply selected typeface to the page
        fontFamily.addEventListener('change', () => {
            document.body.style.fontFamily = fontFamily.value;
        });

        // Update font-size and its displayed value
        fontSize.addEventListener('input', () => {
            text.style.fontSize = `${fontSize.value}px`;
            fontSizeValue.textContent = `${fontSize.value}px`;
        });

        // Update line-height and its displayed value
        lineHeight.addEventListener('input', () => {
            text.style.lineHeight = lineHeight.value;
            lineHeightValue.textContent = lineHeight.value;
        });

        // Update letter-spacing and its displayed value
        letterSpacing.addEventListener('input', () => {
            text.style.letterSpacing = `${letterSpacing.value}em`;
            letterSpacingValue.textContent = `${letterSpacing.value}em`;
        });

        // Update word-spacing and its displayed value
        wordSpacing.addEventListener('input', () => {
            text.style.wordSpacing = `${wordSpacing.value}em`;
            wordSpacingValue.textContent = `${wordSpacing.value}em`;
        });

        // Update font-kerning from the selected radio option
        document.querySelectorAll('input[name="fontKerning"]').forEach((radio) => {
            radio.addEventListener('change', () => {
                if (radio.checked) {
                    text.style.fontKerning = radio.value;
                }
            });
        });
    </script>
</body>
</html>
